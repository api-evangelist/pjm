sla:
  url: null
  uptime_target: null
  note: >-
    No API service-level agreement or uptime commitment is published for Data Miner 2
    or the eTools browserless interfaces. PJM publishes load-test expectations
    instead (see rate-limits/pjm-rate-limits.yml) and explicitly states those times
    "are not a guarantee".
data_quality:
  backfill_policy: >-
    "PJM will attempt to fix or mitigate technical issues that might impede the data
    refresh process for feeds updated throughout the operating day. However, PJM
    typically will not update the data to replace the missed intervals. The final
    data usually becomes available on the next business day through a 'verified'
    feed for most feeds."
  source: PJM Data Miner FAQs
roadmap:
  url: https://www.pjm.com/committees-and-groups/forums/tech-change-forum.aspx
  cadence: monthly
  note: >-
    "PJM continues to enhance Data Miner by adding new data and migrating data from
    other sources. The project timeline is presented at the PJM Tech Change Forum each
    month." (PJM Data Miner FAQs) The forum page carries the meeting materials that
    constitute the published roadmap.
