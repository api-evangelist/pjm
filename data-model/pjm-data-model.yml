generated: '2026-07-27'
method: derived
source: >-
  PJM Data Miner API Guide (v15, 02/10/2026) Appendix A "Feed Long names to short
  names mapping" and section III "API Attribute descriptions", plus the Data Miner
  release notes for feeds added after Appendix A was last refreshed.
api: PJM Data Miner 2 API
base_url: https://api.pjm.com/api/v1
note: >-
  PJM publishes no OpenAPI that can be retrieved anonymously, so this entity map is
  derived from the official PDF guide rather than from a spec. Every feed short name
  below is quoted verbatim from PJM's own mapping table; the `domain` grouping is an
  API Evangelist heuristic and is NOT published by PJM. Each feed is addressed as
  GET /api/v1/{feed} for data and GET /api/v1/{feed}/metadata for its definition,
  columns and publication frequency.
access_pattern:
  data: 'GET /api/v1/{feed}?rowCount=&startRow=&datetime_beginning_ept=&fields=&sort=&order='
  metadata: 'GET /api/v1/{feed}/metadata'
  auth: Ocp-Apim-Subscription-Key header or subscription-key query parameter (see authentication/pjm-authentication.yml)
entities:
- name: pnode
  description: >-
    Pricing node — the atomic location entity of the PJM market. Every LMP row is
    keyed to a pnode. The Pricing Nodes feed carries pnode_id, pnode_name,
    pnode_type, pnode_subtype, zone, voltage, effective_date and terminate_date.
  feed: Pnode
  id_field: pnode_id
- name: aggregate pnode
  description: >-
    Fixed weighted-average aggregate definitions — hubs, zones and other aggregates
    built from constituent pnodes.
  feed: agg_definitions
  id_field: agg_pnode_id
- name: tie line
  description: Interchange tie lines between PJM and neighbouring balancing authorities.
  feed: act_sch_interchange
  id_field: tie_line
- name: zone / area
  description: >-
    Transmission zone and region identifiers used as filters across load, generation
    and billing feeds (e.g. MIDATL, RTO, WESTERN_REGION, SOUTHERN_REGION, and
    utility-scoped values such as BG&E/MIDATL, PSE&G/MIDATL).
  id_field: zone
relationships:
- from: LMP feeds (da_hrl_lmps, rt_hrl_lmps, rt_fivemin_hrl_lmps, rt_da_monthly_lmps, rt_fivemin_mnt_lmps)
  to: pnode
  kind: belongs_to
  via: pnode_id
  evidence: >-
    The guide's documented two-call pattern resolves pnode ids from the Pnode feed
    (filtered by zone and pnode_subtype) and feeds them into the LMP query, because
    zone filters are disabled on five-minute LMPs for volume reasons.
- from: agg_definitions
  to: pnode
  kind: has_many
  via: agg_pnode_id
- from: mnt_ftr_zonal_lmps
  to: pnode
  kind: belongs_to
  via: pnode_id
- from: ftr_cong_lmp
  to: pnode
  kind: belongs_to
  via: pnode_id
- from: act_sch_interchange
  to: tie line
  kind: belongs_to
  via: tie_line
- from: load and generation feeds
  to: zone / area
  kind: belongs_to
  via: area
versioned_rows:
  applies_to: LMP feeds
  fields: [row_is_current, version_nbr]
  description: >-
    LMP rows are versioned. row_is_current=true returns only the latest version,
    false returns older versions, all returns every version; version_nbr carries the
    version number of the row.
time_keys:
  description: >-
    Almost every feed is keyed on a paired UTC/EPT timestamp. The guide lists 42
    date-time attribute names, of which the most common are:
  common: [datetime_beginning_utc, datetime_beginning_ept, datetime_ending_utc, datetime_ending_ept]
feed_count_appendix_a: 68
