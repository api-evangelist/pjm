- aid: pjm:pjm-oasis-template-api
  name: PJM OASIS Template API
  description: >-
    PJM's Open Access Same-Time Information System (OASIS) node, the FERC Order 889
    obligation implemented against the NAESB Wholesale Electric Quadrant business
    practice standards. PJM states support for NAESB WEQ-002 (Standards and
    Communication Protocol) and WEQ-003 (Data Dictionary) versions 2.0, 2.1, 2.2
    and 3.3, accepting query/response and input/response templates over HTTP GET
    (Content-type text/plain) and POST (application/x-www-form-urlencoded) against
    the template base URL, plus three PJM custom templates (pjmannulment,
    pjmtransreq, pjmtsrcomment). The NAESB WEQ-002-4.5.2 public information page at
    https://pjmoasis.pjm.com/OASIS/PJM/INFO.HTM is served anonymously (verified
    HTTP 200 on 2026-07-27); template submission itself requires a PJM SSO session
    token or the PJM Command Line Interface tool.
  humanURL: https://www.pjm.com/markets-and-operations/etools/oasis.aspx
  baseURL: https://pjmoasis.pjm.com/OASIS/PJM/data/
  image: https://www.pjm.com/assets/MVC/responsive/img/pjm-logo.png
  tags:
  - OASIS
  - Transmission
  - NAESB
  - FERC Order 889
  - Available Transfer Capability
