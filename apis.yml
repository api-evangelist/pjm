    url: authentication/pjm-authentication.yml
- aid: pjm:pjm-edart-api
  name: PJM eDART Browserless API
  description: >-
    The browserless XML-over-HTTP interface to eDART, PJM's Dispatcher Applications
    and Reporting Tool, used by transmission owners and generation owners to file
    and query transmission and generator outage tickets, voltage schedules and
    other reliability data. PJM publishes the XML document definitions for the
    general endpoints openly at
    https://www.pjm.com/pjmfiles/pub/etools/edart/xmldocs/xmldoc.html (verified HTTP
    200, ~482KB, on 2026-07-27), while the endpoints themselves sit behind PJM SSO
    and PKI at https://edartsso.pjm.com/edart/. Documentation is public; the data
    is participant-only.
  humanURL: https://www.pjm.com/markets-and-operations/etools/edart.aspx
  baseURL: https://edartsso.pjm.com/edart/
  image: https://www.pjm.com/assets/MVC/responsive/img/pjm-logo.png
  tags:
  - Outages
  - Reliability
  - Transmission
  - XML
  - Members Only
  properties:
