apis:
- aid: pjm:pjm-data-miner-2-api
  name: PJM Data Miner 2 API
  description: >-
    PJM's public wholesale market and system data catalogue, exposed as a REST API
    behind Azure API Management. Feeds include day-ahead and real-time hourly and
    five-minute LMPs, ancillary service prices and market results, generation by
    fuel type, hourly metered/estimated/preliminary load, load forecasts,
    generation and transmission outages, FTR auction bids and zonal LMPs, pnode and
    aggregate definitions, and uplift and billing determinants. Each feed supports
    a /metadata call and a search call with rowCount/startRow paging, field
    selection, sorting and date-range filters, and JSON or CSV output. The data is
    designated public by PJM and the key is free, but anonymous calls are rejected
    — verified HTTP 401 on GET https://api.pjm.com/api/v1/gen_by_fuel on 2026-07-27
    — and redistribution requires at minimum a PJM Associate Membership.
  humanURL: https://www.pjm.com/markets-and-operations/etools/data-miner-2
  baseURL: https://api.pjm.com/api/v1
  image: https://www.pjm.com/assets/MVC/responsive/img/pjm-logo.png
