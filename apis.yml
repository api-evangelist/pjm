- aid: pjm:pjm-inschedule-api
  name: PJM InSchedule Browserless API
  description: >-
    The browserless REST interface to PJM InSchedule, the eTool market participants
    use to submit and retrieve bilateral internal energy transaction schedules and
    contracts. PJM's browserless authentication guide documents CSV file upload
    under /inschedule/rest/secure/upload/file/{filename} and CSV retrieval under
    /inschedule/rest/secure/download/csv/contracts with start and stop date
    parameters, both authenticated with a pjmauth session cookie. Anonymous access
    is refused — an unauthenticated GET of the documented contracts endpoint on
    2026-07-27 returned the ForgeRock OpenAM sign-in page rather than data. This is
    a member/participant surface, not an open data API.
  humanURL: https://www.pjm.com/markets-and-operations/etools/inschedule.aspx
  baseURL: https://insched.pjm.com/inschedule/rest
  image: https://www.pjm.com/assets/MVC/responsive/img/pjm-logo.png
  tags:
  - Scheduling
  - Bilateral Transactions
  - Energy Markets
  - Members Only
  properties:
  - type: Guide
