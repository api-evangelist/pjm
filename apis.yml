aid: pjm
url: https://raw.githubusercontent.com/api-evangelist/pjm/refs/heads/main/apis.yml
name: PJM Interconnection
kind: company
description: >-
  PJM Interconnection is the regional transmission organization (RTO) that operates
  the largest competitive wholesale electricity market in the United States,
  coordinating the movement of electricity across all or parts of Delaware,
  Illinois, Indiana, Kentucky, Maryland, Michigan, New Jersey, North Carolina,
  Ohio, Pennsylvania, Tennessee, Virginia, West Virginia and the District of
  Columbia for roughly 67 million people. PJM sits at the wholesale layer of the
  energy value chain — it has no retail customers, so no Green Button, ESPI or
  consumer data-sharing obligation applies to it. Its API posture is honestly
  "rich data, universally gated": PJM publishes a large machine-readable market
  data catalogue through the Data Miner 2 API at https://api.pjm.com/api/v1 and an
  Azure API Management developer portal at https://apiportal.pjm.com, but every
  feed returns HTTP 401 anonymously and a free subscription key is only issued
  after a PJM Tools account is registered and approved by a Customer Account
  Manager. Its one genuinely mandated interface is the FERC Order 889 / NAESB WEQ
  OASIS node, which is verifiably live and standards-conformant at
  https://pjmoasis.pjm.com, though template submission also requires an
  authenticated PJM SSO session. One genuinely anonymous PJM REST API does exist and
  is easy to miss: the Messages public web service at
  https://messages.pjm.com/messages/rest/public/messages, linked as "Web Service" from
  the Upcoming Changes page, returns the planned-outage and impact notices for the
  whole PJM tool estate with no credential, in XML or JSON.
image: https://www.pjm.com/assets/MVC/responsive/img/pjm-logo.png
tags:
- Energy
- United States
