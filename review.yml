sources:
  - url: https://www.pjm.com/-/media/DotCom/etools/data-miner-2/data-miner-2-api-guide.ashx
    type: Guide
    status: 200
    bytes: 2634674
    note: >-
      PJM Data Miner API Guide, PJM (c) 2026. Source for the base URL
      https://api.pjm.com/api/v1, the Ocp-Apim-Subscription-Key header and
      subscription-key query parameter, the /{feed}/metadata and /{feed}? query
      patterns, rowCount/startRow/sort/order/fields/format=csv parameters, the
      50,000 row page cap, the member (600/min) vs non-member (6/min) connection
      limits, the registration and approval workflow, the redistribution
      restriction, and Appendix A mapping feed long names to API short names.
  - url: https://www.pjm.com/-/media/DotCom/etools/oasis/pjm-oasis-api-user-guide.pdf
    type: Guide
    status: 200
    bytes: 1322297
    note: >-
      PJM OASIS API User Guide, Revision 04, effective 2023-01-27. Source for NAESB
      WEQ-002/WEQ-003 version support, the OASIS template base URLs, GET/POST
      submission requirements, the PJM Template Catalog / Data Dictionary /
      Template Builder tooling, the PJM CLI, and the three PJM custom templates.
  - url: https://www.pjm.com/-/media/DotCom/etools/pjm-browserless-authentication-guide.pdf
    type: Guide
    status: 200
    bytes: 267347
    note: >-
      PJM RESTful API for Authentication. Source for the SSO authenticate/logout
      endpoints, the X-OpenAM-Username / X-OpenAM-Password headers, the tokenId
      response, the pjmauth / pjmauthtrain cookie, and the documented InSchedule
      upload and download REST paths.
  - url: https://www.pjm.com/-/media/DotCom/etools/security/pki-authentication-guide.pdf
    type: Guide
    status: 200
    bytes: 1296372
    note: PKI-Based Authentication Guide — client-certificate/mTLS requirement for API clients.
  - url: https://www.pjm.com/-/media/DotCom/etools/edart/dart-browserless-user-guide.pdf
    type: Guide
    status: 200
    bytes: 5689448
    note: >-
      eDART Browserless User Guide, version 1.28.0, 2026-07-02. Points at
      https://edartsso.pjm.com/edart/ and at the public XML endpoint documentation.
  - url: https://pjmoasis.pjm.com/OASIS/PJM/INFO.HTM
    type: PublicInformation
    status: 200
    note: NAESB WEQ-002-4.5.2 mandated public posting, served anonymously.
  - url: https://apiportal.pjm.com/
    type: APIPortal
    status: 200
    note: Azure API Management developer portal; catalogue behind sign-in.

actions:
  apisYmlCreated: true
  apisListed: 5
  openapiDirectory: false
  reason: >-
    Five real, documented PJM APIs were recorded — Data Miner 2, the OASIS template
    API, the browserless SSO authentication API, InSchedule and eDART. No OpenAPI,
    AsyncAPI, Postman or JSON Schema artifact was saved because none could be
    retrieved: the only machine-readable contract endpoint discovered
    (services.pjm.com/PJMDataminerApi/swagger/docs/v1) returns HTTP 500. Nothing
    was invented.
