aid: pjm
name: PJM Interconnection
review:
  question: >-
    Does PJM Interconnection expose a real, documented public API surface, and does
    any energy data mandate apply to it that it has actually implemented?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  method: >-
    Anonymous HTTP probing of pjm.com and its subdomains, plus retrieval and
    full-text extraction of PJM's own published PDF guides (Data Miner API Guide,
    OASIS API User Guide, Browserless Authentication Guide, eDART Browserless User
    Guide). Every URL below carries the HTTP status observed on 2026-07-27.

mandate:
  homeMarket: United States
  tier: system-operator
  regime: other
  regimeDetail: >-
    No consumer energy data right applies to PJM. PJM is a wholesale regional
    transmission organization with no retail customers, so Green Button / NAESB
    ESPI, the Australian Consumer Data Right, the Ontario Green Button regulation
    and UK-style smart-meter infrastructure mandates are all out of scope for it.
    The obligation that does apply is the FERC Order 889 requirement that
    transmission providers operate an Open Access Same-Time Information System
    (OASIS), implemented against the NAESB Wholesale Electric Quadrant business
    practice standards WEQ-002 (Standards and Communication Protocol) and WEQ-003
    (Data Dictionary). That is a wholesale transmission-transparency obligation,
    not a consumer data right, and it is recorded here as "other".
  status: live-implemented
  statusEvidence:
    - >-
      GET https://pjmoasis.pjm.com/OASIS/PJM/INFO.HTM returned HTTP 200 anonymously
      (18,417 bytes) and is the NAESB WEQ-002-4.5.2 mandated public "Online
      Resources" posting, carrying explicitly numbered standard references
      (001-13.1.4 PJM waivers, 001-C exemptions, 002-4.3.4.2 Emergency Procedures,
      002-4.5.1A NERC TLR, 002-4.5.1B ATC/CBM/TRM methodology, 002-4.5.1C service
      request status, 002-4.5.1D tariff, 002-4.5.2 OASIS home page). This is a
      standards-conformant surface, not a claim.
    - >-
      PJM's own OASIS API User Guide (Revision 04, effective 2023-01-27, retrieved
      HTTP 200, 1,322,297 bytes from
      https://www.pjm.com/-/media/DotCom/etools/oasis/pjm-oasis-api-user-guide.pdf)
      states the PJM OASIS supports NAESB WEQ-002 and WEQ-003 versions 2.0, 2.1,
      2.2 and 3.3, gives the production template base URL
      https://pjmoasis.pjm.com/OASIS/PJM/data/ and the training base URL
      https://oasistrain.pjm.com/OASIS/PJM/data/, and documents GET
      (Content-type text/plain) and POST (application/x-www-form-urlencoded)
      submission per WEQ-002-4.2.4 through 4.2.7, plus three PJM custom templates
      (pjmannulment, pjmtransreq, pjmtsrcomment).
    - >-
      GET https://oasis.pjm.com/ returned HTTP 302 to
      https://www.pjm.com/markets-and-operations/etools/oasis.aspx (HTTP 200),
      which links the OASIS user guide, the OASIS API user guide, the Java 11+
      command line interface ZIP (HTTP 200), and monthly confirmed OASIS
      reservation data as anonymous CSV/ZIP/XLSX downloads back to 2018 — e.g.
      /-/media/DotCom/etools/oasis/confirmed-oasis-requests/2026/2026-july.csv.
  statusCaveat: >-
    The mandated OASIS node is live and conformant, but the machine-readable
    template interface is NOT anonymous: PJM's OASIS API User Guide requires either
    a browser session after login or a PJM SSO token obtained via the Browserless
    Authentication Guide. The mandate produced a real standards-based API; it did
    not produce an open one. Bare GET of
    https://pjmoasis.pjm.com/oasis/PJM/data?TEMPLATE=query_transstatus&VERSION=1.5
    returned HTTP 404 anonymously.

  dataStandard: >-
    NAESB WEQ-002 (Standards and Communication Protocol) and WEQ-003 (Data
    Dictionary), versions 2.0, 2.1, 2.2 and 3.3, for the OASIS node. Data Miner 2
    is a proprietary PJM feed shape (feed short names such as da_hrl_lmps,
    rt_fivemin_hrl_lmps, gen_by_fuel, hrl_load_metered) with no standard reference
    found. eDART uses PJM-proprietary XML documented at
    https://www.pjm.com/pjmfiles/pub/etools/edart/xmldocs/xmldoc.html. No Green
    Button / ESPI, no CIM 61968/61970, no OpenADR, no IEEE 2030.5 and no OCPP/OCPI
    reference was found anywhere on the PJM developer surface.

  consumerVsMarketSplit:
    consumerDataApi: false
    consumerDataNote: >-
      PJM has no retail customers and publishes no individual-customer usage or
      billing API. There is no Green Button Download My Data or Connect My Data
      surface, and no third-party consent or accreditation mechanism, because none
      applies to an RTO.
    marketDataOpen: false
    marketDataNote: >-
      This is the finding. PJM publishes a genuinely deep wholesale market data
      catalogue and calls it "public data", but it is not anonymously open. GET
      https://api.pjm.com/api/v1/gen_by_fuel?rowCount=1 returned HTTP 401 with no
      key; GET https://api.pjm.com/api/v1/ returned HTTP 401; the training host GET
      https://api-train.pjm.com/api/v1/pnode returned HTTP 401. A nonexistent feed
      name returns HTTP 404, so the 401s confirm real, key-gated feeds rather than
      missing routes. The Data Miner API Guide also states that "redistribution of
      information and or data contained in or derived from Data Miner is strictly
      prohibited without a PJM membership", with a minimum Associate Membership
      required for commercial use or derivatives. The only anonymously reachable
      PJM data surfaces found were the OASIS public information page, the monthly
      confirmed OASIS reservation CSV/ZIP archive on pjm.com, and the emergency
      procedures dashboard at
      https://emergencyprocedures.pjm.com/ep/pages/dashboard.jsf (HTTP 200, HTML,
      not an API). Contrast with EIA, which serves comparable US energy data
      anonymously — PJM does not.

  accessGate: application-approval
  accessGateSteps: >-
    1) Register a PJM Tools username at
    https://accountmanager.pjm.com/accountmanager/pages/public/new-user.jsf (or via
    the Sign up link on https://apiportal.pjm.com/, HTTP 200) and set a password
    within a four-hour window. 2) PJM member companies then log into PJM Account
    Manager, open the Account Access tab and use "Request Access" to select Data
    Miner API. 3) Non-member companies must instead email accountmanager@pjm.com
    with the statement "I confirm that the PJM Data will be used for internal
    business purposes only", including their Account Manager user id and
    subscribing email address, and wait for provisioning instructions. 4) A
    Customer Account Manager approves the request; a confirmation email is issued.
    5) The subscription key is then retrieved from View Profile > Your
    Subscriptions in PJM Tools. 6) Commercial use, publishing or derivative works
    require becoming a PJM member (Associate Membership minimum). Rate limits
    differ by status: 600 connections per minute for members, 6 per minute for
    non-members.
  gated: true

  authModel:
    - scheme: API key (Azure API Management subscription key)
      appliesTo: Data Miner 2 API (https://api.pjm.com/api/v1)
      detail: >-
        Header Ocp-Apim-Subscription-Key, or query parameter subscription-key
        appended to the URL, per the PJM Data Miner API Guide (2026 revision).
        Azure API Management confirmed by the developer portal config at
        https://apiportal.pjm.com/config.json (HTTP 200), which returns
        managementApiUrl
        https://apim-prd.management.azure-api.net/.../Microsoft.ApiManagement/service/apim-prd,
        managementApiVersion 2022-04-01-preview and powCaptcha.Enabled true.
    - scheme: Session token over single sign-on (ForgeRock OpenAM)
      appliesTo: OASIS, InSchedule, eDART and other PJM eTools
      detail: >-
        POST to https://sso.pjm.com/access/authenticate/ with headers
        X-OpenAM-Username and X-OpenAM-Password returns a JSON body containing
        tokenId; that token is then presented as a "pjmauth" cookie (pjmauthtrain
        in training) on tool API calls, and released via POST
        https://sso.pjm.com/access/logout/. GET
        https://sso.pjm.com/access/authenticate/ returned HTTP 405 Method Not
        Allowed on 2026-07-27, confirming the documented POST-only endpoint is
        live. An anonymous GET of the documented InSchedule contracts endpoint
        returned the ForgeRock OpenAM login page (HTTP 200 HTML, CDDL header), not
        data.
    - scheme: mTLS / PKI client certificate
      appliesTo: Custom-code REST clients against PJM eTools
      detail: >-
        PJM's tools security programme requires establishing two-way SSL with a
        client certificate against the access/authenticate/pjmauthcert endpoint
        alongside credentials to obtain the SSO token. Documented in
        https://www.pjm.com/-/media/DotCom/etools/security/pki-authentication-guide.pdf
        (HTTP 200, 1,296,372 bytes).
    - scheme: OpenID Connect discovery
      appliesTo: none
      detail: >-
        GET https://api.pjm.com/.well-known/openid-configuration returned HTTP 404.
        GET https://www.pjm.com/.well-known/openid-configuration returned HTTP 200
        but served the pjm.com HTML shell, not a discovery document — treated as a
        soft 404. No OIDC discovery is published.

findings:
  developerPortal:
    url: https://apiportal.pjm.com/
    status: 200
    confirmed: true
    platform: Azure API Management developer portal
    note: >-
      Title "Home - PJM API Portal", description "Discover APIs, learn how to use
      them, try them out interactively, and sign up to acquire keys." The portal
      home page and /signin (HTTP 200) are anonymous, but the API catalogue is not:
      GET https://apiportal.pjm.com/apis returned HTTP 404 anonymously, as did
      /api-details and /developer. PJM's Data Miner API Guide confirms the detailed
      API specification is only reachable after signing in and clicking through to
      the "DataMiner Web API". This is a real developer portal, but it is not
      self-serve.
  specHarvest:
    openapiHarvested: false
    specsCount: 0
    note: >-
      A publicly reachable Swagger UI exists at
      https://services.pjm.com/PJMDataminerApi/swagger (HTTP 200, titled "PJM
      Dataminer API", Swashbuckle-generated, apiKeyName "api_key" in query,
      oAuth2Enabled false). Its declared discovery path is swagger/docs/v1, but GET
      https://services.pjm.com/PJMDataminerApi/swagger/docs/v1 returned HTTP 500
      with body {"message":"An error has occurred."} — as did the lowercase host
      path variant and the trailing-slash variant. No machine-readable contract was
      therefore harvestable. Nothing was fabricated to fill the gap; the openapi/
      directory is intentionally absent.
